spring:
  application:
    name: chs-backend-hexagonal-poc
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:${SQLITE_DB_PATH:./channel-poc.sqlite3}"
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite/schema.sql
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

core:
  http:
    base-url: ${CORE_BASE_URL:http://127.0.0.1:8091}
    connect-timeout-ms: ${CORE_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${CORE_READ_TIMEOUT_MS:2000}
