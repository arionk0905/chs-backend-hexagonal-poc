spring:
  application:
    name: chs-backend-hexagonal-poc
  datasource:
    url: "${DB_URL:jdbc:mariadb://127.0.0.1:${DB_PORT:3306}/${DB_NAME:chs_poc}}"
    username: "${DB_USERNAME:chs}"
    password: "${DB_PASSWORD:}"
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

core:
  http:
    base-url: ${CORE_BASE_URL:http://127.0.0.1:8091}
    connect-timeout-ms: ${CORE_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${CORE_READ_TIMEOUT_MS:2000}
